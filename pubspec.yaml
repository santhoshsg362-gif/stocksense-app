name: stocksense_app
description: AI-Powered Stock Portfolio Tracker

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP calls to Spring Boot backend
  http: ^1.2.1

  flutter_local_notifications: ^17.2.2

  # State management
  provider: ^6.1.2

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.2.0

  # Charts
  fl_chart: ^0.68.0

  # WebView for TradingView charts
  webview_flutter: ^4.7.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Local storage for theme preference
  shared_preferences: ^2.2.3

  # Loading shimmer effect
  shimmer: ^3.0.0

  # Icons
  cupertino_icons: ^1.0.6

  # Number formatting
  intl: ^0.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true